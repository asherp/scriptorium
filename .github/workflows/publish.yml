name: Publish

# Pushing a `vX.Y.Z` tag publishes that version to crates.io, which is how a
# consuming site pins an engine release rather than building from a moving
# branch. The tag and the manifest have to agree — a mismatch is a mis-tag,
# and failing here is cheaper than a wrong version on crates.io.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v${tag} does not match Cargo.toml version ${manifest}" >&2
            exit 1
          fi

      - name: Test before publishing
        run: cargo test --all-features

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
