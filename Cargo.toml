[package]
name = "scriptorium"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "A procedural manuscript-illumination engine: a stochastic L-system grown from a seed, walked by a turtle that traces the silhouettes of the glyphs and the text around it."
repository = "https://github.com/asherp/scriptorium"
readme = "README.md"
keywords = ["l-system", "illumination", "svg", "typography", "wasm"]
categories = ["graphics", "text-processing", "wasm"]
exclude = ["/.github"]

[lib]
crate-type = ["cdylib", "rlib"]

# The native build is the default and pulls in nothing but serde: every
# decision this engine makes is arithmetic over rectangles and strings, and
# all of it is testable with `cargo test` on a bare checkout, no browser.
# `--features wasm` adds the bindgen layer a host page talks to.
[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
serde = { version = "1", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
